name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Test with the oldest Node.js that the package supports (node_version_requirement in plugin.py), which is newer
      # than the runners' default.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Dockerfile syntax, which Sublime Text doesn't include.
          extra-packages: asbjornenge/Docker.tmbundle@v
