name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    uses: sublimelsp/lsp_smoke_test/.github/workflows/smoke-test.yml@v1
    with:
      # Provides the Containerfile syntax, which Sublime Text doesn't include.
      extra-packages: |
        keith-hall/Containerfile-sublime-syntax@ST4-v
