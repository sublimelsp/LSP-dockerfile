name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Test with the oldest Node.js that the package supports (node_version_requirement in plugin.py).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          extra-packages: asbjornenge/Docker.tmbundle@v
