name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Test with the oldest Node.js that the package supports (node_version_requirement in plugin.py).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          extra-packages: asbjornenge/Docker.tmbundle@v

  # A single check whose name doesn't depend on the os matrix, for rulesets to require. It runs even when the workflow
  # is cancelled: a skipped job counts as passing for a required check.
  result:
    name: Smoke test result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Smoke test result: $RESULT"
          test "$RESULT" = success
